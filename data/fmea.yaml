# FMEA of the network (DOSSIER section 12.1). Severity and probability per MIL-STD-882E Tables I-II [MIL882E]:
# severity 1 catastrophic .. 4 negligible; probability A frequent .. F eliminated. Ratings are for the
# recommended architecture A2 after mitigation; `before` gives the single-bus legacy (A0/A1) rating.
# All entries basis: assumed (engineering judgement, reasoning in the `effect` and `mitigation` text).
modes:
  - {id: FM01, item: "By-wire CAN harness", mode: "Open circuit (chafe, connector)", effect: "Channel silent; on one bus all steering commands lost", detection: "E2E timeout per channel (30 ms)", mitigation: "Second channel routed on the opposite hull side; SINGLE state, crew warning", sev: 1, before: D, after: E}
  - {id: FM02, item: "By-wire CAN harness", mode: "CAN_H-CAN_L short or short to ground", effect: "Bus stuck dominant/recessive, channel dead", detection: "E2E timeout; transceiver dominant time-out", mitigation: "Dual channel; dominant time-out transceivers", sev: 1, before: D, after: E}
  - {id: FM03, item: "By-wire CAN harness", mode: "Short to 28 V (MIL-STD-1275 surge on the harness)", effect: "Transceivers damaged on one channel", detection: "E2E timeout", mitigation: "Transceivers rated for +/-58 V bus fault; channels on separate connectors", sev: 1, before: D, after: E}
  - {id: FM04, item: "Termination", mode: "One terminator lost", effect: "Reflections, rising bit-error rate, error frames", detection: "Error counters > 96 (heavily disturbed bus note, CAN20 p. 26)", mitigation: "Error-model margin in RTA; HUMS logs TEC/REC", sev: 3, before: C, after: D}
  - {id: FM05, item: "Any node on a by-wire bus", mode: "Babbling idiot (stuck transmit loop at high priority)", effect: "All lower identifiers starve; channel lost", detection: "Transmit guardian rate check", mitigation: "Guardian latches the transmitter off (C library); dual channel", sev: 1, before: C, after: E}
  - {id: FM06, item: "Steering actuator node", mode: "Bus-off after repeated transmit errors", effect: "Actuator status lost on that channel for >= 100 ms", detection: "Bus-off interrupt; VCU sees status timeout", mitigation: "Status on both channels; recovery after 128x11 bits + 100 ms", sev: 2, before: C, after: E}
  - {id: FM07, item: "VCU", mode: "Frozen task re-sends the same frame", effect: "Stale steering set-point looks valid", detection: "E2E counter does not advance (REPEATED)", mitigation: "Counter check; LOST after timeout -> safe stop", sev: 1, before: C, after: E}
  - {id: FM08, item: "Any node", mode: "Frame with wrong identifier or wrong source (masquerade)", effect: "Wrong set-point accepted", detection: "Data ID folded into CRC", mitigation: "E2E data ID per signal group", sev: 1, before: D, after: E}
  - {id: FM09, item: "EMI (radio transmit, CS114 bulk current)", mode: "Burst of bit errors", effect: "Retransmissions, longer response times", detection: "CRC-15 + error frames (automatic)", mitigation: "RTA with burst + sporadic error model; shielded twisted pair", sev: 3, before: B, after: C}
  - {id: FM10, item: "One channel copy", mode: "Undetected corruption that passes CRC-15 and CRC-8", effect: "Two copies with the same counter disagree", detection: "Cross-channel comparison (disagree counter)", mitigation: "Discard and flag; residual error rate below 1e-9/h", sev: 1, before: E, after: F}
  - {id: FM11, item: "Gateway", mode: "Overload or task overrun", effect: "Gatewayed navigation frames late (inherited jitter)", detection: "Age stamp in the frame", mitigation: "VCU reads the backbone directly (A2-A4)", sev: 3, before: C, after: E}
  - {id: FM12, item: "Ethernet switch", mode: "Switch power loss", effect: "C4I, video and navigation to the VCU lost", detection: "Link down", mitigation: "Path following degrades to driver control; by-wire stays on CAN", sev: 2, before: D, after: D}
  - {id: FM13, item: "Ethernet switch", mode: "Misconfigured priority (video above control)", effect: "Navigation delayed by video bursts", detection: "Configuration check at start-up (PCP map)", mitigation: "Locked configuration, NC bound re-run as acceptance test", sev: 3, before: C, after: E}
  - {id: FM14, item: "Common cause", mode: "Both by-wire channels cut by one event (same routing, fire, blast)", effect: "Steering by-wire lost", detection: "Both channels time out", mitigation: "Physically separate routes; safe stop on LOST", sev: 1, before: D, after: E}
