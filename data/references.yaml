# Reference list. Keys are used in data/*.yaml (`src:`) and in DOSSIER.md ([KEY]). Web sources accessed
# 10 Nov 2026. "read" = the cited parts were read in the document; "secondary" = known only through a summary;
# "not re-checked" = standard textbook knowledge not re-opened for this study. Vendor documents are cited by a
# generic title; their addresses are kept in the author's private source list.

# --- systems engineering ---------------------------------------------------------------------------
W2016: "C. S. Wasson, System Engineering Analysis, Design, and Development: Concepts, Principles, and Practices, 2nd ed., Wiley, 2016 (read: ch. 4-7, 13, 19-22, 26-27, 31-34; page numbers are the printed ones)."

# --- CAN, J1939 and real-time analysis ---------------------------------------------------------------
DAVIS2007: "R. I. Davis, A. Burns, R. J. Bril, J. J. Lukkien, Controller Area Network (CAN) schedulability analysis: Refuted, revisited and revised, Real-Time Systems 35(3):239-272, 2007, doi:10.1007/s11241-007-9012-7 (read in full: Eq. 1-22, Tables 2-4, sections 3-4)."
CAN20: "CAN Specification Version 2.0, Part A and Part B, Sep 1991 (read: frame format p. 12-15, CRC p. 13, error frames, fault confinement rules 1-12 p. 24-26)."
ISO11898: "ISO 11898-1:2015 (data link layer, CAN FD frame format) and ISO 11898-2:2016 (high-speed physical layer); not read, used through CAN20 and the CAN FD frame description in secondary sources."
J1939PHY: "SAE J1939-11 (250 kbit/s shielded), J1939-15 (250 kbit/s unshielded) and J1939-14 (500 kbit/s) physical layers; limits (40 m backbone, 1 m / 3 m stubs, 30 / 10 nodes; 500 kbit/s 30 m) from public summaries (secondary); the standards themselves are paywalled."
J1939TP: "SAE J1939-21 data link layer: PDU1/PDU2 identifier layout, priority 0-7 (0 highest), TP up to 1785 bytes via TP.CM/TP.DT, read in the Linux kernel J1939 documentation (docs.kernel.org/networking/j1939.html); BAM packet spacing 50-200 ms from secondary sources only."
J1939-22: "SAE J1939-22, Data Link Layer for CAN FD (title and scope page only; not read)."
FMS2010: "FMS-Standard Interface Description according to SAE J1939, issue 02.00, 11 Nov 2010 (read: PGN repetition rates of CCVS, EEC1, EEC2, LFE, ET1, AMB, HOURS, LFC, DD, VDHR, TIRE)."
AUTOSAR-E2E: "AUTOSAR FO R22-11, E2E Protocol Specification, Document ID 849 (read: section 6.5 Profile 1, Tables 6.12-6.13, PRS_E2E_00075/00218)."
CRCCAT: "Catalogue of parametrised CRC algorithms (CRC RevEng), entries CRC-15/CAN (check 0x059e), CRC-8/SAE-J1850 (check 0x4b) and CRC-8/GSM-A (check 0x37); read."

# --- open vehicle architecture and Ethernet ----------------------------------------------------------
COS599905: "COS 599905, 2nd edition (Prague 2020), Generic Vehicle Architecture for Land Systems, the national adoption of STANAG 4754 Ed. 1 / AEP-4754(A) Vol. I-VII (read: terms incl. MilCAN A/B p. 10, minimum and optimal architectures section 7 p. 16-18: two bus types CAN and Ethernet preferred, safety-critical buses unaffected by data growth, diagnostics)."
AEP4754: "AEP-4754(A), NATO Generic Vehicle Architecture (NGVA) for Land Systems, Vol. III Data Infrastructure (not read directly; scope as adopted in COS599905)."
IEEE8021Q: "IEEE Std 802.1Q, Bridges and Bridged Networks: priority code points, strict-priority transmission selection, credit-based shaper (802.1Qav) and scheduled traffic (802.1Qbv); not re-checked."
LEBOUDEC2001: "J.-Y. Le Boudec, P. Thiran, Network Calculus: A Theory of Deterministic Queuing Systems for the Internet, Springer LNCS 2050, online edition (read: Proposition 1.3.4 non-pre-emptive priority node p. 21, Theorems 1.4.1-1.4.3 p. 22-23, 1.4.6 pay bursts only once)."

# --- vehicle dynamics and control --------------------------------------------------------------------
CHALMERS2013: "P. Nilsson, K. Tagesson, Single-track models of an A-double heavy vehicle combination, Chalmers University of Technology, Report 2013:08 (read: section 2 model, section 3 cornering-stiffness fit, Table B.1)."
WONG2008: "J. Y. Wong, Theory of Ground Vehicles, 4th ed., Wiley, 2008, ch. 5 (handling characteristics, linear single-track model); not re-checked."
RAJAMANI2012: "R. Rajamani, Vehicle Dynamics and Control, 2nd ed., Springer, 2012, ch. 2 (lateral vehicle dynamics); not re-checked."
COULTER1992: "R. C. Coulter, Implementation of the Pure Pursuit Path Tracking Algorithm, CMU-RI-TR-92-01, Carnegie Mellon University, 1992; not re-checked."
OGATA2010: "K. Ogata, Modern Control Engineering, 5th ed., Prentice Hall, 2010 (phase margin, delay e^{-sT}); not re-checked."

# --- safety, reliability, environment -------------------------------------------------------------
MIL882E: "MIL-STD-882E, Standard Practice: System Safety, 11 May 2012, Tables I-III (severity, probability, risk matrix)."
MIL338B: "MIL-HDBK-338B, Electronic Reliability Design Handbook, 1 Oct 1998 (series/parallel RBD, exponential model)."
IEC61508-6: "IEC 61508-6:2010 Annex D (beta-factor common-cause model) and IEC 61508-1 Table 3 (PFH bands per SIL); known through secondary sources, not read."
ISO26262: "ISO 26262:2018 (road vehicles functional safety): fault tolerant time interval, ASIL decomposition; concepts only, not read."
MIL461G: "MIL-STD-461G, Requirements for the Control of Electromagnetic Interference Characteristics of Subsystems and Equipment, 11 Dec 2015 (CS114 bulk cable injection and RS103 radiated susceptibility apply to Army ground equipment; levels not re-checked)."
MIL1275F: "MIL-STD-1275F, Characteristics of 28 Volt DC Input Power to Utilization Equipment in Military Vehicles, 7 Sep 2022 (read for the author's power-system study: starting IES >= 12 V for <= 1 s, cranking >= 16 V, 100 V surge)."
