[project]
name = "vnet"
version = "1.0.0"
description = "In-vehicle network architecture of a drive-by-wire wheeled armoured vehicle: J1939/CAN response-time analysis (Davis 2007), CAN FD, Ethernet network calculus, steer-by-wire latency tolerance, E2E redundancy in C"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "PyYAML>=6.0", "python-can>=4.3", "cantools>=39.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E402", "B905", "E741", "B023"]

[tool.ruff.lint.per-file-ignores]
"tools/results_md.py" = ["E501"]
